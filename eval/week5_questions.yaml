# Week 5 Task Set A -- candidate question pool for trace sampling.
#
# PROVENANCE: this pool is meant to stand in for "everything a real customer or
# agent might type at this app", not for "the questions that make a nice demo".
# It was built by reading all eight indexed articles (the six new HC-4001..4006
# drops plus the two legacy HC-1007/HC-1012 articles) and writing one candidate
# per fact worth asking about, BEFORE any of the 20 traces below were sampled or
# run:
#   - error_code_ticket   (51 items) -- one question per troubleshooting-table
#     error code across all six new articles. Every code in every table is
#     represented; none were selected by hand. Phrasing rotates across five
#     realistic support-ticket templates by position (index % 5), not by choice
#     per code, so no code got an easier or harder template on purpose.
#   - policy_prose        (11 items) -- non-error-code facts (dates, rules,
#     retry counts) drawn from both the new and the legacy articles.
#   - colloquial_paraphrase (8 items) -- the same underlying facts, phrased the
#     way an agent typing quickly actually writes, not the way the article does.
#   - out_of_corpus       (8 items) -- realistic questions the corpus does not
#     cover at all (three of these, O1-O3, are eval/questions.yaml's original
#     U1-U3, reused because that question recurs in real traffic).
#   - multi_part_ambiguous (6 items) -- genuinely hard cases: an ambiguous
#     product area, a two-part question mixing an answerable and an unanswerable
#     half, two error codes in one message, and messages with little or no
#     specific content.
#
# SAMPLING: 20 of the 84 items below are drawn for this week's trace set by
# `python rag.py trace-sample`, which calls
# ragchat.tracing.sample_questions(pool, n=20, seed=5) --
# `random.Random(5).sample(pool, 20)` over this file in the order below. The
# seed (5, for "Week 5") was fixed before the sampler was ever run and was not
# re-rolled after seeing which 20 came out; see eval/week5_writeup.md for the
# resulting id list and eval/week5_open_coding.yaml for the per-trace notes.

