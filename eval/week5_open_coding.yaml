      ERR-4093 currency-conversion row, because both share generic "billing period" vocabulary;
      the extractive generator then confidently cited three sentences about invoice-period
      anchoring that never mention currency at all -- a fully grounded, citation-valid answer
      that is nonetheless about the wrong thing, with nothing to flag it as such.

