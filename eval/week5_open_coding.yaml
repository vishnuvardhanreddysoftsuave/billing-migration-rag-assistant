# Week 5 Task Set A -- open coding notes on the 20 sampled traces.
#
# PROVENANCE: written by reading every file under results/week5_traces/*.md (one
# per sampled question, generated by `python rag.py trace-sample`, which ran the
# 20 questions drawn by eval/week5_questions.yaml's sampler through the real,
# currently-shipped pipeline: structure-aware chunking, hybrid retrieval, the
# extractive generation backend that ships when no Anthropic credentials are
# present). Each note below was written from that one trace alone, in id order,
# BEFORE any grouping happened -- `problem_group` and `severity` were assigned
# only after all 20 notes existed, which is why the note text sometimes states a
# raw observation ("coverage 47%, missing: trying, info, going") that only later
# turned out to be an instance of a pattern repeated across several other traces.
#
# severity scale (assigned per trace, after the note was written):
#   0 = no issue: the outcome (answer or refusal) was correct
#   1 = cosmetic: correct outcome, but with a quality nit worth fixing eventually
#   2 = moderate: a defensible outcome, but a better system would have done more
#   3 = severe: the corpus has a good answer and the user did not get it, or the
#       user got a wrong answer with no indication it might be wrong
#
# problem_group is null for severity 0 (no problem to group). Group names and
# descriptions live in ragchat.tracing.PROBLEM_GROUPS so the report generator
# and this file cannot drift out of sync with each other.

version: 1
authored_at: "2026-08-25"
traces_generated_at: "see results/week5_traces.json:generated_at"

coding:
  - trace_id: C6
    category: colloquial_paraphrase
    outcome: "refused (defensible)"
    severity: 2
    problem_group: ambiguous_no_clarifying_question
    note: >-
      Correctly declines to guess which of several webhook error codes applies to this
      genuinely ambiguous ticket (coverage 40%, missing: stuff, stopped, idea) -- but gives a
      flat refusal instead of asking which error code or symptom the customer actually saw,
      even though four different HC-4006 webhook rows were sitting in the top-5.

